<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="misty forest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1ee"/>
      <stop offset=".5" stop-color="#c7d2c9"/>
      <stop offset="1" stop-color="#9db2a2"/>
    </linearGradient>
    <linearGradient id="fogband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eeea" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e9eeea" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e9eeea" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7565"/>
      <stop offset="1" stop-color="#38503f"/>
    </linearGradient>
    <g id="pine">
      <path d="M0 -170 L24 -118 L11 -118 L36 -66 L20 -66 L48 -12 L7 -12 L7 0 L-7 0 L-7 -12 L-48 -12 L-20 -66 L-36 -66 L-11 -118 L-24 -118 Z"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M0 540 Q220 488 430 516 T860 508 T1290 520 T1600 500 V900 H0 Z" fill="#b3c2b6" opacity=".85"/>

  <g fill="#8ba394" opacity=".6">
    <use href="#pine" transform="translate(70 660) scale(.7)"/>
    <use href="#pine" transform="translate(185 645) scale(.8)"/>
    <use href="#pine" transform="translate(300 655) scale(.68)"/>
    <use href="#pine" transform="translate(415 642) scale(.78)"/>
    <use href="#pine" transform="translate(530 658) scale(.72)"/>
    <use href="#pine" transform="translate(648 645) scale(.8)"/>
    <use href="#pine" transform="translate(762 656) scale(.7)"/>
    <use href="#pine" transform="translate(878 644) scale(.76)"/>
    <use href="#pine" transform="translate(995 657) scale(.68)"/>
    <use href="#pine" transform="translate(1112 646) scale(.8)"/>
    <use href="#pine" transform="translate(1228 656) scale(.72)"/>
    <use href="#pine" transform="translate(1345 644) scale(.78)"/>
    <use href="#pine" transform="translate(1462 656) scale(.7)"/>
    <use href="#pine" transform="translate(1565 646) scale(.75)"/>
  </g>
  <rect y="520" width="1600" height="200" fill="url(#fogband)"/>

  <g fill="#68816f" opacity=".8">
    <use href="#pine" transform="translate(120 800) scale(1.1)"/>
    <use href="#pine" transform="translate(330 790) scale(1.25)"/>
    <use href="#pine" transform="translate(545 800) scale(1.05)"/>
    <use href="#pine" transform="translate(760 788) scale(1.2)"/>
    <use href="#pine" transform="translate(975 800) scale(1.1)"/>
    <use href="#pine" transform="translate(1190 790) scale(1.28)"/>
    <use href="#pine" transform="translate(1405 800) scale(1.08)"/>
    <use href="#pine" transform="translate(1575 792) scale(1.2)"/>
  </g>
  <rect y="690" width="1600" height="180" fill="url(#fogband)" opacity=".8"/>

  <rect y="800" width="1600" height="100" fill="url(#ground)"/>
  <g fill="#49604f">
    <use href="#pine" transform="translate(180 899) scale(1.55)"/>
    <use href="#pine" transform="translate(520 899) scale(1.4)"/>
    <use href="#pine" transform="translate(895 899) scale(1.6)"/>
    <use href="#pine" transform="translate(1255 899) scale(1.45)"/>
    <use href="#pine" transform="translate(1540 899) scale(1.55)"/>
  </g>

  <rect width="1600" height="240" fill="url(#fogband)" opacity=".55"/>
